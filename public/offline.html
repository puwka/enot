<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1739" />
    <title>Нет подключения — ЕнотМани</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
        background: #0b1739;
        color: #fff;
      }
      .offline {
        width: min(100%, 420px);
        text-align: center;
      }
      .offline__logo {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        margin: 0 auto 20px;
        display: block;
      }
      .offline h1 {
        margin: 0 0 12px;
        font-size: 1.35rem;
        font-weight: 700;
      }
      .offline p {
        margin: 0 0 24px;
        color: rgba(255, 255, 255, 0.78);
        line-height: 1.5;
        font-size: 0.95rem;
      }
      .offline__btn {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 14px 22px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        background: #12b5a2;
        color: #fff;
        min-width: 160px;
      }
      .offline__btn:active {
        background: #0d9b8a;
      }
      .offline__home {
        display: inline-block;
        margin-top: 16px;
        color: rgba(255, 255, 255, 0.72);
        text-decoration: none;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="offline">
      <img class="offline__logo" src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1>Нет подключения к интернету</h1>
      <p>Проверьте сеть и попробуйте снова. Личный кабинет и админка доступны только онлайн.</p>
      <button type="button" class="offline__btn" id="retry">Повторить</button>
      <a class="offline__home" href="/">На главную</a>
    </div>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
